<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phobia Relief Therapy</title>
  <script>
    (function () {
      const url = new URL(window.location.href);
      const search = url.searchParams;
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const isRecovery = search.get('type') === 'recovery' || search.has('token_hash') || hash.get('type') === 'recovery' || hash.has('access_token') || hash.has('refresh_token');
      const target = isRecovery ? './password-reset/' : './registration-success/';
      window.location.replace(target + window.location.search + window.location.hash);
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0d0e12;
      color: #f5f7fb;
      font-family: system-ui, sans-serif;
    }

    a {
      color: #ff7043;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <p>If you are not redirected automatically, open <a href="./registration-success/">registration success</a> or <a href="./password-reset/">password reset</a>.</p>
</body>
</html>
